version: 2.1

jobs:
  build-and-release:
    working_directory: ~/repo
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          name: docker-deploy
          command: sh ./docker-release.sh

workflows:
  build:
    jobs:
      - build-and-release:
          filters:
            branches:
              only:
                - main
